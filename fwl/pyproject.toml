[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fwl"
version = "0.1.0"
description = "FWL — Firewall Language compiler for eBPF/XDP"
requires-python = ">=3.11"
dependencies = [
  "lark>=1.1",
  "click>=8.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-snapshot>=0.9",
  "flake8>=7.0",
]
agent = [
  "claude-code-sdk>=0.0.25",
]

[project.scripts]
fwl = "fwl.cli:main"
fwl-test-agent = "fwl.tools.test_agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fwl*"]

# The grammar is read at import time with importlib.resources, so a
# wheel without it produces an `fwl` that raises FileNotFoundError on
# `import fwl.cli` — before it can print a usage message, and for every
# subcommand. Nobody hit it on a development machine because
# `pip install -e` leaves the source tree in place; the first box it
# reached was an appliance, where it means the datapath is running the
# policy it booted with and can never be given another.
[tool.setuptools.package-data]
fwl = ["*.lark"]
