[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fwl"
version = "0.1.0"
description = "FWL — Firewall Language compiler for eBPF/XDP"
requires-python = ">=3.11"
dependencies = [
  "lark>=1.1",
  "click>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "flake8>=7.0",
]

[project.scripts]
fwl = "fwl.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fwl*"]
