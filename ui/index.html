<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>f — eBPF Firewall</title>
  <script src="/htmx.min.js"></script>
  <style>
    :root {
      --bg: #0f172a; --bg1: #1e293b; --bg2: #334155;
      --fg: #e2e8f0; --fg2: #94a3b8; --fg3: #64748b;
      --accent: #38bdf8; --green: #22c55e;
      --red: #ef4444; --yellow: #eab308;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-monospace, 'Cascadia Code',
        'Source Code Pro', Menlo, Consolas, monospace;
      background: var(--bg); color: var(--fg);
      font-size: 14px; line-height: 1.5;
    }

    /* Nav */
    nav {
      background: var(--bg1); padding: 12px 24px;
      display: flex; gap: 24px; align-items: center;
      border-bottom: 1px solid var(--border);
    }
    nav .brand {
      color: var(--accent); font-weight: bold;
      font-size: 18px; margin-right: 12px;
    }
    nav a {
      color: var(--fg3); text-decoration: none;
      font-size: 14px; padding: 4px 0;
      border-bottom: 2px solid transparent;
    }
    nav a:hover { color: var(--fg); }
    nav a.active {
      color: var(--fg);
      border-bottom-color: var(--accent);
    }

    /* Layout */
    .container { max-width: 1200px; margin: 0 auto;
                 padding: 24px; }

    /* Cards */
    .card {
      background: var(--bg1); border-radius: 8px;
      padding: 20px; margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .card h2 {
      font-size: 12px; color: var(--fg3);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 16px; font-weight: 500;
    }

    /* Status grid */
    .status-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px 40px;
    }
    .status-item { display: flex; align-items: baseline;
                   gap: 8px; }
    .status-label { color: var(--fg3); font-size: 13px; }
    .status-value { color: var(--fg); font-weight: 600; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: var(--green);
      margin-right: 6px; vertical-align: middle;
    }

    /* Tables */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; color: var(--fg3);
      font-weight: 500; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    th.right { text-align: right; }
    td {
      padding: 8px 12px; font-size: 13px;
      border-bottom: 1px solid #1e293b;
    }
    td.right { text-align: right; }
    td.mono { font-variant-numeric: tabular-nums; }
    tr:hover { background: rgba(56, 189, 248, 0.04); }

    /* Interface cards */
    .iface-item {
      display: flex; justify-content: space-between;
      align-items: center; padding: 12px 16px;
      background: var(--bg); border-radius: 6px;
      margin-bottom: 8px;
    }
    .iface-name { font-weight: 600; }
    .iface-idx { color: var(--fg3); font-size: 12px;
                 margin-left: 10px; }
    .badge {
      font-size: 11px; padding: 2px 8px;
      border-radius: 4px; font-weight: 500;
    }
    .badge-green {
      background: rgba(34,197,94,0.15);
      color: var(--green);
    }

    /* Log */
    .log-scroll {
      max-height: 400px; overflow-y: auto;
      font-size: 12px;
    }
    .log-entry { padding: 2px 0; }
    .log-ts { color: var(--fg3); }
    .log-lvl { font-weight: 600; }
    .log-info { color: var(--fg2); }
    .log-warn { color: var(--yellow); }
    .log-error { color: var(--red); }
    .log-debug { color: var(--fg3); }

    /* Buttons */
    button, .btn {
      background: var(--bg2); color: var(--fg);
      border: none; padding: 6px 12px;
      border-radius: 4px; cursor: pointer;
      font-size: 12px; font-family: inherit;
    }
    button:hover { background: #475569; }
    .btn-danger { background: #7f1d1d; color: #fca5a5; }
    .btn-danger:hover { background: #991b1b; }

    /* Sections */
    .section { display: none; }
    .section.active { display: block; }

    /* Forms */
    .form-row {
      display: flex; gap: 8px; align-items: end;
      flex-wrap: wrap; margin-bottom: 16px;
    }
    .form-group { display: flex; flex-direction: column;
                  gap: 4px; }
    .form-group label {
      font-size: 11px; color: var(--fg3);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    input, select {
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 4px;
      font-family: inherit; font-size: 13px;
      width: 140px;
    }
    input:focus, select:focus {
      outline: none; border-color: var(--accent);
    }
    select { width: 100px; }
    .btn-primary {
      background: #1d4ed8; color: #fff;
      padding: 6px 16px;
    }
    .btn-primary:hover { background: #2563eb; }

    /* Divider */
    .divider {
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    /* Empty state */
    .empty {
      color: var(--fg3); font-style: italic;
      padding: 20px; text-align: center;
    }
  </style>
</head>
<body>
  <nav>
    <span class="brand">f</span>
    <a href="#" onclick="showSection('dashboard')" class="active"
       id="nav-dashboard">Dashboard</a>
    <a href="#" onclick="showSection('rules')"
       id="nav-rules">Rules</a>
    <a href="#" onclick="showSection('conntrack')"
       id="nav-conntrack">Conntrack</a>
    <a href="#" onclick="showSection('interfaces')"
       id="nav-interfaces">Interfaces</a>
    <a href="#" onclick="showSection('log')"
       id="nav-log">Log</a>
  </nav>

  <div class="container">
    <div id="section-dashboard" class="section active">
      <div class="card">
        <h2><span class="status-dot"></span>Status</h2>
        <div hx-get="/api/v1/status" hx-trigger="load, every 5s"
             hx-swap="innerHTML">
          <div class="empty">Loading...</div>
        </div>
      </div>
      <div class="card">
        <h2>Traffic</h2>
        <div id="traffic-chart" style="height:250px;"></div>
      </div>
      <div class="card">
        <h2>Counters</h2>
        <div hx-get="/api/v1/counters" hx-trigger="load, every 2s"
             hx-swap="innerHTML">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>

    <div id="section-rules" class="section">
      <div class="card">
        <h2>Add Rule</h2>
        <form id="add-rule-form" onsubmit="return addRule()">
          <div class="form-row">
            <div class="form-group">
              <label>Src IP</label>
              <input type="text" id="r-src" placeholder="0.0.0.0">
            </div>
            <div class="form-group">
              <label>Dst IP</label>
              <input type="text" id="r-dst" placeholder="0.0.0.0">
            </div>
            <div class="form-group">
              <label>Proto</label>
              <select id="r-proto">
                <option value="0">ANY</option>
                <option value="6" selected>TCP</option>
                <option value="17">UDP</option>
                <option value="1">ICMP</option>
              </select>
            </div>
            <div class="form-group">
              <label>SPort</label>
              <input type="number" id="r-sport"
                     placeholder="0" value="0" style="width:80px">
            </div>
            <div class="form-group">
              <label>DPort</label>
              <input type="number" id="r-dport"
                     placeholder="443" style="width:80px">
            </div>
            <div class="form-group">
              <label>Action</label>
              <select id="r-action">
                <option value="0">DROP</option>
                <option value="1">ALLOW</option>
                <option value="2">RATE LIMIT</option>
              </select>
            </div>
            <button type="submit" class="btn-primary">
              Add Rule</button>
          </div>
        </form>
      </div>
      <div class="card">
        <h2>Active Rules</h2>
        <div id="rules-list" hx-get="/api/v1/rules"
             hx-trigger="load" hx-swap="innerHTML">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>

    <div id="section-conntrack" class="section">
      <div class="card">
        <h2>Connection Tracking</h2>
        <div hx-get="/api/v1/conntrack" hx-trigger="load, every 2s"
             hx-swap="innerHTML">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>

    <div id="section-interfaces" class="section">
      <div class="card">
        <h2>Attached Interfaces</h2>
        <div hx-get="/api/v1/interfaces" hx-trigger="load"
             hx-swap="innerHTML">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>

    <div id="section-log" class="section">
      <div class="card">
        <h2>Log</h2>
        <div hx-get="/api/v1/log" hx-trigger="load, every 2s"
             hx-swap="innerHTML">
          <div class="empty">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function ipToInt(ip) {
      if (!ip || ip === '0.0.0.0') return 0;
      const parts = ip.split('.');
      if (parts.length !== 4) return 0;
      return ((+parts[0])<<24 | (+parts[1])<<16 |
              (+parts[2])<<8 | (+parts[3])) >>> 0;
    }

    async function addRule() {
      const rule = {
        src_addr: ipToInt(
          document.getElementById('r-src').value),
        dst_addr: ipToInt(
          document.getElementById('r-dst').value),
        src_port: +document.getElementById('r-sport').value,
        dst_port: +document.getElementById('r-dport').value,
        proto: +document.getElementById('r-proto').value,
        action: +document.getElementById('r-action').value,
        rate_pps: 0,
      };
      try {
        const resp = await fetch('/api/v1/rules', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            default_action: 0,
            conntrack_enabled: 0,
            conntrack_timeout_s: 300,
            rules: [rule],
          }),
        });
        if (resp.ok) {
          htmx.trigger('#rules-list', 'load');
        }
      } catch(e) { console.error(e); }
      return false;
    }

    function showSection(name) {
      document.querySelectorAll('.section').forEach(
        s => s.classList.remove('active'));
      document.querySelectorAll('nav a').forEach(
        a => a.classList.remove('active'));
      document.getElementById('section-' + name)
        .classList.add('active');
      document.getElementById('nav-' + name)
        .classList.add('active');
    }
  </script>
  <script src="/plotly.min.js" async onload="initChart()"></script>
  <script>
    function initChart() {
      Plotly.newPlot('traffic-chart', [{
        x: [], y: [], type: 'scatter', mode: 'lines',
        line: { color: '#38bdf8', width: 2 },
        fill: 'tozeroy',
        fillcolor: 'rgba(56,189,248,0.08)',
      }], {
        paper_bgcolor: 'transparent',
        plot_bgcolor: 'transparent',
        margin: { t: 10, r: 20, b: 30, l: 50 },
        xaxis: { color: '#64748b', gridcolor: '#1e293b' },
        yaxis: { color: '#64748b', gridcolor: '#1e293b',
                 title: { text: 'pps', font: { size: 11 } } },
        font: { family: 'monospace', color: '#94a3b8', size: 11 },
      }, { responsive: true, displayModeBar: false });

      const ts = [], pkt = [];
      let prev = 0;
      setInterval(async () => {
        try {
          const r = await fetch('/api/v1/counters');
          const d = await r.json();
          let tot = 0;
          d.forEach(c => tot += c.packets);
          const rate = tot - prev; prev = tot;
          ts.push(new Date().toLocaleTimeString());
          pkt.push(rate >= 0 ? rate : 0);
          if (ts.length > 60) { ts.shift(); pkt.shift(); }
          Plotly.update('traffic-chart',
            { x: [ts], y: [pkt] });
        } catch(e) {}
      }, 2000);
    }
  </script>
</body>
</html>
