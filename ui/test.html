<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>f test</title>
  <style>
    body { background: #0f172a; color: #e2e8f0; margin: 0;
           font-family: monospace; padding: 1.5rem; }
    .card { background: #1e293b; border-radius: 0.5rem;
            padding: 1rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1 style="color: #38bdf8;">f — eBPF Firewall</h1>
  <div class="card">
    <h2>Status</h2>
    <div id="status">Loading...</div>
  </div>
  <div class="card">
    <h2>Traffic</h2>
    <div id="chart" style="height:200px;"></div>
  </div>
  <script>
    fetch('/api/v1/status')
      .then(r => r.json())
      .then(d => {
        document.getElementById('status').innerText =
          JSON.stringify(d, null, 2);
      });
  </script>
  <script src="/plotly.min.js" async onload="
    Plotly.newPlot('chart', [{
      y: [0], type: 'scatter',
      line: {color: '#38bdf8'}
    }], {
      paper_bgcolor: 'transparent',
      plot_bgcolor: 'transparent',
      margin: {t:10,r:20,b:30,l:50},
      font: {color: '#94a3b8'},
      xaxis: {gridcolor:'#334155'},
      yaxis: {gridcolor:'#334155'}
    }, {responsive:true, displayModeBar:false});
  "></script>
</body>
</html>
